A:
  task: >-
    Write the full Phase 3 implementation plan in docs/superpowers/plans/2026-05-26-phase-3-charge-system.md.

    INPUT: Read these research deliverables first:
    - docs/research/phase-3-budget-codepath-map.md (codepath map from Clone A)
    - docs/research/phase-3-charge-persistence.md (persistence design from Clone B — recommends JSON+lockfile)
    - docs/research/phase-3-budget-layers.md (multi-layer budget architecture from Clone C — 9 chunks)

    Also read: docs/superpowers/specs/2026-05-06-manta-pattern-design.md Sec 6.4, 9.4, 15.

    STRUCTURE: Follow the same plan format as existing plans (e.g. docs/superpowers/plans/2026-05-08-phase-2a-forking-spawn.md).
    Each plan has Chunks with numbered Tasks. Each task has: purpose, files touched, test strategy, acceptance criteria.

    SCOPE: The plan should cover ALL of Clone C's 9 chunks (3.1-3.9), restructured into 2 plan chunks:
    - Chunk 1: ChargeStore + ChargeLedger + DailySpendLedger + BudgetConfig + BusPaths extension + tests
    - Chunk 2: PreSpawnGate + dry-run + auto-downgrade + CLI commands (cost, charges, refresh, limit) + post-cast settlement + e2e tests

    IMPORTANT:
    - Use JSON+lockfile for persistence (not SQLite). Clone B's analysis was conclusive.
    - Cross-reference exact field names from existing code: grep signatures in predecessor plans before naming interfaces.
    - Use snake_case for JSON fields (bus convention) and camelCase for TypeScript interfaces.
    - Each task must list files to create/modify with exact paths.
    - Test tasks use TDD: failing test first, then implementation.
    - Commit the plan file when done. Use git -c user.email="tr00x@proton.me" -c user.name="Tim Hunt".
  approach_hint: >-
    Read the 3 research docs carefully. They contain the design decisions.
    Read at least one existing plan (2026-05-08-phase-2a-forking-spawn.md) for format reference.
    Grep existing code for exact interfaces you'll reference (RunCastOptions, BusPaths, BusContext, etc.).
    The plan should be self-contained: a reader with no context should be able to implement each task.
