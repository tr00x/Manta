A:
  task: >-
    Production-quality bug audit of @manta/bus and @manta/orchestrator packages.
    The codebase is at HEAD (commit 01ef4d4). 928 tests currently pass. The
    most recent bugs found by humans are documented in docs/manta-bugs.md
    (#1-#18); use that as your taxonomy of "what kind of bug do we miss."

    Specifically look for the same class of latent issues we have hit before:
    (a) Schema strictness gaps — z.object without .strict() where it matters
        (drive-by fields leaking into production). Cross-check every Zod
        schema in packages/manta-bus/src/schema.ts and orchestrator schemas.
    (b) Audit-fire on idempotent calls — like bug #14 (audit fires on no-op
        mutations). Pattern to grep: any call to atomicMutateJson + audit
        callback. Verify the mutator semantics.
    (c) In-place mutation defeating reference-identity checks — like bug #15
        (mutator mutates current and returns it, defeating next!==current
        idempotency detection).
    (d) Reference-equality on objects when JSON-equality is needed — bug #14
        and #15 are the same class; check if any other stores have this
        pattern.
    (e) Metadata fields rendered unsanitized — like bug #18 (post-mortem.ts
        renders raw record.metadata). Check every render-to-string code path
        in @manta/orchestrator for similar unbounded rendering. Especially
        post-mortem-writer.ts, scoring.ts (if it emits anything), and any
        forensic-timeline writers.
    (f) DEAD/IDLE state confusion — Bug #16 (Registry rejects re-register for
        DEAD clones). Check if WorkQueueStore, ClaimsStore, LocksStore have
        analogous state-confusion issues with their cleanup semantics. Also
        check daemon-mode state transitions (IDLE/WAITING_FOR_TASK) for similar
        edge cases.
    (g) Forking-isolation gaps — every MCP handler that should reject FR-cast
        cross-clone calls. Cross-check forking-isolation.ts against handler
        list in tools/index.ts; any handler NOT calling siblingsInSameForkingCast
        when it should be is a bug.
    (h) Race conditions on parallel writes — multiple clones calling
        manta_register / manta_claim_work / manta_heartbeat under contention.
        The atomic-fs.ts mutex is per-file but cross-file consistency is not
        enforced. Check if there are read-then-write patterns that race.
    (i) Lock TTL edge cases — Locks have heartbeat-based renewal. What
        happens if a clone DIES between heartbeat-update and lock-renewal?
        Is the lock leaked? Audit Locks.ts + reaper logic in orchestrator.

    For each bug found:
    1. If trivial fix (< 15 LOC, root-cause clear, no behavior change): fix
       it in code with a regression test. Atomic commit.
    2. If non-trivial or risky: append to docs/manta-bugs.md (next # is 19+)
       with Discovered/Severity/Status:Open/Reproducer/Root cause if known/
       Fix (proposed)/Lessons. Do NOT skip the lesson — that's the value.
    3. If you cannot tell whether the pattern is a bug or by-design: append
       to docs/manta-bugs.md as Status:Investigating with your reasoning.

    Deliverable:
    - docs/audits/2026-05-28-cast-A-bus-orchestrator-audit.md (your structured
      report: surfaces audited, patterns found, evidence, severity guesses).
      ~400-600 LOC.
    - Updates to docs/manta-bugs.md for any new bugs.
    - Code fixes (each as a separate change set within your worktree branch)
      for trivial fixes you applied. If you fixed N bugs, your branch should
      have N+1 logical changes (N fixes + 1 audit doc + bug-log updates).

    HARD RULES:
    - Do NOT fix bugs in test files. Test changes are out of scope.
    - Do NOT touch packages/manta-cli — that's clone B's surface.
    - Do NOT write new files outside docs/audits/ and existing source/test
      files of @manta/bus + @manta/orchestrator.
    - Do NOT modify docs/manta-bugs.md severity scale, structure header, or
      existing bugs #1-#18. Append-only.
    - Stay within max-files-changed=8 budget. If audit produces more bug
      findings than fixable, prioritize the doc — bug-log entries are the
      durable artifact; fixes can come in follow-up casts.
    - Verify each fix with `pnpm -r test --filter @manta/bus` or
      `pnpm -r test --filter @manta/orchestrator` BEFORE marking it done in
      your audit doc.
  approach_hint: >-
    Start with smart_outline or grep across packages/manta-bus/src and
    packages/manta-orchestrator/src to get the file census. Then for each
    pattern (a)-(i) above, do one focused pass. Don't try to read everything
    end-to-end — that's recon-swarm work. This is targeted bug-hunting.
    For pattern (a) schema strictness: grep for "z.object" without ".strict()"
    in the bus + orchestrator packages. For pattern (e) metadata rendering:
    grep for "record.metadata" or "JSON.stringify(metadata" or any string
    interpolation involving metadata fields. For pattern (g) forking-isolation:
    every MCP handler that takes a clone_id input should be checked.
    Verify reproducers by writing a minimal failing test FIRST when possible,
    then fixing. This is TDD discipline per CLAUDE.md.

B:
  task: >-
    Production-quality bug audit of @manta/cli package (with focus on
    cast.ts, daemon-loop, tick-loop, spawner, dispatchers, runtime, commands).
    The codebase is at HEAD (commit 01ef4d4). 928 tests currently pass. The
    most recent bugs found by humans are documented in docs/manta-bugs.md
    (#1-#18); use that as your taxonomy of "what kind of bug do we miss."

    Specifically look for the same class of latent issues we have hit before:
    (a) Schema strictness gaps — Zod schemas without .strict() where drive-by
        fields would be a problem. Check cast.ts contract building, dispatch
        inputs, snapshot-builder, runtime composition.
    (b) Cross-plan field-name drift — places where one module calls another
        with field names that don't match the callee's schema. CLAUDE.md
        Plan-writing discipline calls this the #1 historical blocker.
        Specifically: grep all callers of @manta/bus tools from @manta/cli
        and verify the field names match the schemas. Look for callers of
        manta.broadcast, manta.message, manta.heartbeat, manta.claim_work,
        manta.contract_*.
    (c) Partial-failure paths in spawner.ts and worktree.ts — what happens
        if addWorktree succeeds but spawnClone fails? Is the worktree
        leaked? Is the registry entry leaked? Trace the partial-failure
        cleanup in clone-spawner.ts + cast.ts.
    (d) Dispatcher race conditions in BroadcastReader / PairDispatcher /
        DocChaseDispatcher / TestStormDispatcher — the dispatch happens on
        tick-loop onCycleComplete. Multiple events arriving between ticks
        could cause double-dispatch or skipped events. Audit the sinceTs
        tracking + the queue enqueue semantics.
    (e) Daemon-mode state machine bugs — IDLE/WAITING_FOR_TASK transitions
        in tick-loop + daemon-loop. What happens if a daemon clone dies
        while WAITING_FOR_TASK? What happens if work-queue dequeue races
        with clone death? What happens if heartbeat times out but the
        clone is actually still running its tool?
    (f) Charge / budget bypass paths — the PreSpawnGate enforces budget,
        but is there any code path that calls clone-spawner.spawn without
        going through runPreSpawnGate first? Including in recovery paths,
        re-task command, daemon respawn?
    (g) ForensicTimeline correctness — does every event that mutates state
        get a timeline entry? Does every cast-spawned clone get its events
        in the timeline? Are there silent drops on disk-full / write
        failures?
    (h) Worktree lifecycle leaks — when does the worktree get removed?
        Only on success? Are there failure paths that leak worktrees forever?
        Cross-check addWorktree + removeWorktree + cleanup-on-abort + cleanup-
        on-failure paths.
    (i) Mode dispatch correctness — cast.ts has if-else branches per mode.
        Are any modes missing from any branch? E.g. does bug-hunt go through
        the merge-review path correctly (it should NOT, since clones are
        complementary not competing). Does refactor-wave merge-all flow
        skip merge-review correctly?

    For each bug found:
    1. If trivial fix (< 15 LOC, root-cause clear, no behavior change): fix
       it in code with a regression test. Atomic commit.
    2. If non-trivial or risky: append to docs/manta-bugs.md (next # is 19+).
       Coordinate with clone A's numbering by checking the doc first; if
       clone A also writes there, use any open # not already taken. Worst
       case main renumbers post-merge.
    3. If you cannot tell whether the pattern is a bug or by-design: append
       as Status:Investigating with reasoning.

    Deliverable:
    - docs/audits/2026-05-28-cast-B-cli-audit.md (~400-600 LOC structured
      report).
    - Updates to docs/manta-bugs.md.
    - Code fixes within your worktree branch (separate logical changes per
      bug fixed).

    HARD RULES:
    - Do NOT touch packages/manta-bus or packages/manta-orchestrator — that's
      clone A's surface.
    - Do NOT touch test files unless adding a regression test for a fix you
      applied.
    - Do NOT write new files outside docs/audits/ and existing source/test
      files of @manta/cli.
    - Append-only on docs/manta-bugs.md.
    - max-files-changed=8 hard cap.
    - Verify each fix with `pnpm -r test --filter @manta/cli` BEFORE
      marking it done in your audit doc.
    - WHEN IN DOUBT about whether a finding is a real bug or by-design:
      check git log for the file (`git log -p --follow <path>`) — the
      commit message often documents intent.
  approach_hint: >-
    Start with `find packages/manta-cli/src -name '*.ts' | head -40` for
    the file census. Cast.ts is the central file (likely 800+ LOC, the
    most fragile). Read it once front-to-back. Then per pattern, grep
    across packages/manta-cli/src. For pattern (b) field-name drift, the
    high-value greps are: every place @manta/cli imports from @manta/bus,
    every place it calls a manta_* MCP tool indirectly through bus-context.
    The most likely places to find bugs are in mode dispatchers (the
    newest code, written by clones in Phase 6) and in daemon-mode lifecycle
    (Phase 5, also clone-written and not yet battle-tested). Read those
    twice. Skip @manta/skill-validator and @manta/snapshot — they're tiny
    and well-covered.
