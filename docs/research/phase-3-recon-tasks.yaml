A:
  task: >-
    Map every cost/budget/charge touch-point in the current Manta codebase.
    Find: (1) where budget_usd fields are used in CLI, spawner, orchestrator;
    (2) how RunCastOptions.budgetUsdPerClone/budgetUsdPerCast flow through cast lifecycle;
    (3) any existing charge/cooldown references in specs or code;
    (4) where orchestrator hooks into clone lifecycle events that would trigger charge mutations.
    Deliverable: docs/research/phase-3-budget-codepath-map.md with file:line references
    and a dependency graph showing which modules need changes for Phase 3.
  approach_hint: >-
    Start with grep for budget, charge, cooldown, cost across all packages.
    Read cast.ts, orchestrator runCycle, and the spec Sec 6.4 + Sec 9 punkt 4.
    Produce a structured map, not prose.

B:
  task: >-
    Design the Manta Charge system per spec Sec 6.4. Two persistence options:
    (1) SQLite-based with WAL mode for concurrent reads during casts;
    (2) JSON+lockfile using existing atomicMutateJson pattern from @manta/bus.
    For each option: schema design, read/write paths, concurrency model,
    failure modes, recovery after crash, audit trail integration.
    Deliverable: docs/research/phase-3-charge-persistence.md with pros/cons
    table and explicit recommendation.
  approach_hint: >-
    Read atomicMutateJson in packages/manta-bus/src/atomic-fs.ts for the JSON pattern.
    Consider: charges.json is tiny (single object) — is SQLite overhead justified?
    Consider: audit log (charges.log) — append-only file vs SQLite table.
    Consider: passive recovery (+1 per 30min idle) — needs timestamp tracking.
    Read spec Sec 6.4 carefully for all edge cases.

C:
  task: >-
    Design the multi-layer token budget system per spec Sec 9 punkt 4:
    (1) Hard token budget per cast (default $15);
    (2) Per-clone hard limit = budget/N;
    (3) Daily session cap (default $50);
    (4) Auto-downgrade when daily remainder < cast cost;
    (5) Cost preview / dry-run.
    Map how these layers interact with the existing CLI budget flags
    (--budget-per-clone-usd, --budget-per-cast-usd) and the charge system.
    Design the CLI surface: new flags, new commands, config file format.
    Deliverable: docs/research/phase-3-budget-layers.md
  approach_hint: >-
    Read the existing budget flow in cast.ts (cumulative cost gate).
    Read spec Sec 9 punkt 4 for the full list of budget layers.
    Consider: daily cap needs persistent state (today's spend) — same store as charges?
    Consider: auto-downgrade UX — how does main get notified and confirm?
    Consider: dry-run as a --dry-run flag on cast vs separate command.
